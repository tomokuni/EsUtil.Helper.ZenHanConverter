name: build

on:
  push:
    branches: [ main ]   # main ブランチに push されたときに実行
  pull_request:
    branches: [ main ]   # main 向けの Pull Request でも実行
  workflow_dispatch:     # 手動実行を許可

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # リポジトリを取得
    - uses: actions/checkout@v4

    # .NET SDK をセットアップ
    # ライブラリ/テスト共に net8.0 を対象とするため 8.0.x を使用
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # ライブラリを Release 構成でビルド（復元も同時に実行）
    - name: Build
      run: dotnet build src/ZenHanConverter.csproj -c Release

    # テストを Release 構成で実行（テストプロジェクト経由で再ビルド）
    - name: Test
      run: dotnet test test/ZenHanConverter.Test.csproj -c Release --verbosity normal
