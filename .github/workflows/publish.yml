name: Publish to NuGet

on:
  push:
    branches: [ main ]   # main ブランチに push されたときに実行
  workflow_dispatch:     # 手動実行を許可（設定ミス後の再公開に必要）

# NuGet Trusted Publishing (OIDC) を利用するため、長期 API キーや Secrets は不要
permissions:
  contents: write        # Git タグ作成 / GitHub Release 作成に必要
  id-token: write        # Trusted Publishing の OIDC トークン発行に必要

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    # リポジトリを取得（タグ作成のため fetch-depth: 0）
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # .NET SDK をセットアップ
    # Trusted Publishing では API キーを扱わないため、NuGet ソースの認証設定は行わない
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # src/*.csproj をすべて列挙
    - name: Find csproj in src/
      id: find_projects
      run: |
        PROJECTS=$(find src -maxdepth 1 -name "*.csproj" | sort)
        echo "projects<<EOF" >> $GITHUB_OUTPUT
        echo "$PROJECTS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # すべての csproj を Release 構成でビルド
    - name: Build all projects
      run: |
        for PROJ in ${{ steps.find_projects.outputs.projects }}; do
          dotnet build "$PROJ" -c Release
        done

    # すべての csproj を pack して artifacts/ に集約
    - name: Pack all projects
      run: |
        mkdir -p artifacts
        for PROJ in ${{ steps.find_projects.outputs.projects }}; do
          dotnet pack "$PROJ" -c Release -o ./artifacts
        done
        ls -l artifacts

    # 公開対象を決定する。
    # タグの有無ではなく「nuget.org に未公開かどうか」で判定するため、
    # 途中で失敗しても再実行すれば未公開分だけが正しく公開される（冪等）。
    - name: Select packages to publish
      id: select
      run: |
        : > publish-list.txt
        MAX_VERSION="0.0.0"
        for PROJ in ${{ steps.find_projects.outputs.projects }}; do
          ID=$(dotnet msbuild "$PROJ" -getProperty:PackageId | tr -d '\r')
          VER=$(dotnet msbuild "$PROJ" -getProperty:Version | tr -d '\r')
          LOWER_ID=$(echo "$ID" | tr '[:upper:]' '[:lower:]')
          LOWER_VER=$(echo "$VER" | tr '[:upper:]' '[:lower:]')

          printf '%s\n%s\n' "$MAX_VERSION" "$VER" | sort -V | tail -n1 > tmp.txt
          MAX_VERSION=$(cat tmp.txt)

          URL="https://api.nuget.org/v3-flatcontainer/${LOWER_ID}/index.json"
          if curl -sf "$URL" | grep -qF "\"${LOWER_VER}\""; then
            echo "skip (already published): $ID $VER"
          else
            echo "publish: $ID $VER"
            echo "$ID $VER" >> publish-list.txt
          fi
        done

        echo "max_version=$MAX_VERSION" >> $GITHUB_OUTPUT
        if [ -s publish-list.txt ]; then
          echo "has_new=true" >> $GITHUB_OUTPUT
          echo "--- publish list ---"
          cat publish-list.txt
        else
          echo "has_new=false" >> $GITHUB_OUTPUT
          echo "公開対象なし（すべて公開済み）"
        fi

    # Git タグを作成して push（既存タグは作成しない = 冪等）
    - name: Create Git Tag
      if: steps.select.outputs.has_new == 'true'
      run: |
        TAG="v${{ steps.select.outputs.max_version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch --tags --force
        if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          echo "tag $TAG は既に存在するためスキップします"
        else
          git tag "$TAG"
          git push origin "$TAG"
        fi

    # GitHub Release を作成し、nupkg を添付（既存の場合は更新）
    - name: Create GitHub Release
      if: steps.select.outputs.has_new == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ steps.select.outputs.max_version }}"
        files: artifacts/*.nupkg
        generate_release_notes: true

    # Trusted Publishing: GitHub の OIDC トークンを nuget.org が検証し、
    # 有効期限 1 時間の一時 API キーを払い出す（長期 API キー・Secrets は不要）
    # 一時キーは短命なため、push の直前に取得する
    - name: NuGet login (OIDC -> temporary API key)
      if: steps.select.outputs.has_new == 'true'
      id: nuget_login
      uses: NuGet/login@v1
      with:
        # nuget.org のプロファイル名（メールアドレスではない）
        user: SEKIYA.Tomokuni

    # 未公開のパッケージのみ NuGet.org に公開
    - name: Push to NuGet
      if: steps.select.outputs.has_new == 'true'
      env:
        # 一時 API キーはログに出さないよう環境変数経由で渡す
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        while read -r ID VER; do
          if [ -z "$ID" ]; then continue; fi
          PKG="artifacts/${ID}.${VER}.nupkg"
          echo "pushing $PKG"
          dotnet nuget push "$PKG" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done < publish-list.txt
